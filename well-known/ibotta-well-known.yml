    status: 200
    content_type: application/json
    file: ibotta-ai-plugin.json
    real_document: true
    note: >-
      ChatGPT plugin manifest, schema_version v1, name_for_model "IbottaShopping". Declares
      api.type openapi at https://ibotta.com/bex-api/api-docs.json, auth.type service_http /
      bearer, contact bexsupport@ibotta.com, legal https://legal.ibotta.com/. This is the
      pointer that led to Ibotta's only public OpenAPI.
