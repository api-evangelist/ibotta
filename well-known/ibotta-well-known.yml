method: probed
source: live probes of /.well-known/ across every Ibotta host named in apis.yml, the OpenAPI servers[] host, and the IPN partner portal
summary: >-
  Two Ibotta-controlled hosts serve real /.well-known documents. ibotta.com serves a legacy
  ChatGPT plugin manifest (/.well-known/ai-plugin.json) that declares Ibotta's only public
  machine-readable API contract. auth.dashboard.ibotta.com — the Auth0 tenant fronting the
  IPN partner portal — serves RFC 8414 / OIDC discovery metadata anonymously. Every other
  path 404s, and ibotta.com answers 200 with an SPA HTML shell for unknown /.well-known/*
  paths, so only the ai-plugin.json hit on that host is a real document.
soft_404_warning: >-
  ibotta.com is a Nuxt SPA with a catch-all route: it returns HTTP 200 text/html (5,539 bytes)
  for EVERY unmatched path, including /.well-known/security.txt, /llms.txt, /openapi.json and
  /.well-known/agent-card.json. Those 200s are NOT documents and are recorded here as misses.
hosts:
