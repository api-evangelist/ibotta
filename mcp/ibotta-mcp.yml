      minPrice:
        type: number
        default: 0
        description: The minimum price of products to retrieve.
      maxPrice:
        type: number
        nullable: true
        description: The maximum price of products to retrieve.
      storeId:
        type: string
        nullable: true
        description: The store ID of the products to retrieve.
