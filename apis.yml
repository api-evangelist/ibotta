aid: ibotta
name: Ibotta
description: >-
  Ibotta is a Denver-based consumer technology company (NYSE: IBTA) that operates
  a cash-back rewards platform and the Ibotta Performance Network (IPN), a digital
  promotions and retail-media network. Consumers earn real cash back on everyday
  purchases in-store and online through the Ibotta mobile app, browser extension,
  and connected retailer loyalty accounts. For brands, agencies, and retailers,
  the Ibotta Performance Network distributes digital rebates and promotions to more
  than 200 million shoppers across Ibotta's owned properties and a network of
  partner retailers and publishers (including Walmart, Dollar General, Family
  Dollar, and others). Ibotta was surfaced in the API Evangelist network as a
  portfolio company of GGV Capital. Ibotta publishes exactly one machine-readable
  API contract: the Ibotta Product API (an OpenAPI 3.0.1 document at
  ibotta.com/bex-api/api-docs.json), declared by the ChatGPT plugin manifest Ibotta
  still serves at ibotta.com/.well-known/ai-plugin.json — a single product-search
  operation backing the Ibotta browser extension, gated by a service bearer token
  that is not self-serve. The Ibotta Performance Network APIs that partners actually
  integrate against are documented only inside the IPN partner portal
  (portal.ipn.ibotta.com), which is behind Auth0 and reached through a sales
  conversation; no public IPN API reference, pricing, or rate-limit documentation
  exists.
