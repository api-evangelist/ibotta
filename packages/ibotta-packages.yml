summary: >-
  Ibotta publishes first-party open-source packages, but NONE of them is a client SDK for an
  Ibotta API. They are internal engineering tools — a Rails cache gem, a UPC helper, a
  geohash library, distributed scikit-learn tooling, a SOPS wrapper — released from Ibotta's
  own GitHub org under their own names. There is no Ibotta API client library on npm, PyPI,
  RubyGems, Maven Central, NuGet, crates.io, Packagist or pkg.go.dev.
